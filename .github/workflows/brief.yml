name: Brief diario de noticias

on:
  # Boton manual. Actions -> Brief diario de noticias -> Run workflow
  workflow_dispatch:
    inputs:
      modo:
        description: "Que tipo de brief generar"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - diario
          - semanal

  schedule:
    # 12:00 UTC = 08:00 en Chile durante el invierno (UTC-4).
    # Lunes a sabado: brief diario. Domingo: resumen semanal.
    # En verano chileno (UTC-3, de septiembre a abril) llega a las 09:00.
    # Si te molesta, cambia 12 por 11 en esos meses.
    - cron: "0 12 * * 1-6"
    - cron: "0 12 * * 0"

# Permite que el workflow guarde el brief en el repositorio
permissions:
  contents: write

# Evita que dos ejecuciones se pisen
concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet "anthropic>=0.40"

      - name: Generar el brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generar_brief.py ${{ github.event.inputs.modo == 'auto' && ' ' || github.event.inputs.modo }}

      - name: Publicar
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add index.html archivo/
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Brief $(date -u +%Y-%m-%d)"
            git push
          fi

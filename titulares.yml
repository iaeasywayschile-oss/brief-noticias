name: Titulares por RSS

on:
  workflow_dispatch:
  schedule:
    # Cada hora, todos los dias. No usa API ni consume creditos.
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: titulares
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Juntar titulares
        run: python agregador.py

      - name: Publicar
        run: |
          git config user.name "titulares-bot"
          git config user.email "titulares-bot@users.noreply.github.com"
          git add titulares.html
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Titulares $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
